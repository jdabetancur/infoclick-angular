# ==========================================================================
# Despliegue automático en GitHub Pages
# Cada vez que se hace push a la rama main, GitHub:
#   1. instala las dependencias (npm ci),
#   2. compila Angular en modo producción con la ruta base del repositorio,
#   3. publica la carpeta dist/.../browser en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
# ==========================================================================
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar Angular
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: Copiar index.html como 404.html
        run: cp dist/infoclick-angular/browser/index.html dist/infoclick-angular/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/infoclick-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
